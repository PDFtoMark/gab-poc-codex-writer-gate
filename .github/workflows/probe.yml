name: Probe collaborator permission
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: query non-collaborator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/collaborators/lazyhacker6/permission" > /tmp/out.json 2>/tmp/err.txt
          echo "exit=$?"
          echo "--- body ---"; cat /tmp/out.json
          echo "--- err ---"; cat /tmp/err.txt
